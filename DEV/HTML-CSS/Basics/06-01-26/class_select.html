<html> 
<head> <title>Class Selector</title> 
    <style> 
        .highlight { 
            background-color: yellow; /* Applies to all elements with class="highlight" */ 
        } 
    </style> 
</head> 
<body> 
    <p class="highlight">This paragraph is highlighted.</p> 
    <p>Pros: Electric vehicles reduce air pollution and fuel costs while providing a smooth and quiet driving experience.<br>
Cons: They have higher initial cost and depend on charging infrastructure with limited driving range.</p> 
</body> 
</html>
