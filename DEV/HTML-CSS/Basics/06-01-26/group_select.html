<head> 
    <title>Group Selector</title> 
    <style> 
        h2, h3 { 
            color: green; /* Applies to all <h2> and <h3> elements */ 
        } 
    </style> 
</head>

    <h2>This is a Heading 2</h2> 
    <h3>This is a Heading 3</h3> 
    <p>This is a paragraph.</p> 
</body> 
</html>
