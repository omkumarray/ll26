<!DOCTYPE html>
<html>
<head>
    <title>EXTERNAL</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>External</h1>
    <h3>THIS IS EXTERNAL CSS</h3>
    <p>
External CSS is written in a separate file with a .css extension and is linked to the HTML file using the &lt;link&gt; tag. It is the best method for large websites because one CSS file can control the design of many pages, making the site easy to update and maintain.
</p>


</body>
</html>
