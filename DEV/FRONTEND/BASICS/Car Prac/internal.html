<html>

<head>
     <title>INTERNAL</title>
    <style>
        p{
            color:blue;
            font-size:20px;
        }
    </style>
</head>

<body>
      <h1 style="color:red"> Internal </h1>
      <h3>THIS IS INTERNAL CSS</h3>
    <p>
Internal CSS is written inside the &lt;style&gt; tag within the &lt;head&gt; section of an HTML file. It is used to style a single webpage. This method is better than inline CSS because it separates content from design, but it is still not ideal for multiple pages.
</p>

</body>

</html>
