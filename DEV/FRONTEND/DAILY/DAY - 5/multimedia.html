<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> DAY - 5</title>
</head>

<body>

     <hr>
    <!-- PHASE -10 & 11 -->
    <!-- Multimedia & Iframes -->
       
        <h1>🎵 HTML Multimedia</h1>

            <hr>

            <!-- Audio Section -->
            <h2>Audio Example</h2>

            <audio controls>
                <source src="song.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>

            <br><br>

            <audio controls autoplay muted loop>
                <source src="song.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>

            <hr>

            <!-- Video Section -->
            <h2>Video Example</h2>

            <video controls width="600" poster="poster.jpg">
                <source src="video.mp4" type="video/mp4">
                <source src="video.webm" type="video/webm">
                Your browser does not support the video element.
            </video>

            <hr>

            <!-- Video with Subtitles -->
            <h2>Video with Subtitles</h2>

            <video controls width="600">
                <source src="video.mp4" type="video/mp4">

                <track
                    src="subtitles.vtt"
                    kind="subtitles"
                    srclang="en"
                    label="English">

                Your browser does not support the video element.
            </video>

            <hr>

            <h2>Summary</h2>

            <ul>
                <li>&lt;audio&gt; → Plays audio</li>
                <li>&lt;video&gt; → Plays video</li>
                <li>&lt;source&gt; → Provides multiple media formats</li>
                <li>&lt;track&gt; → Adds subtitles</li>
            </ul>



        <hr>
        <!-- -->
        

    
</body>

</html>
