<!doctype html>
<html lang="en">
  <head>
    <title>CV Form</title>
  </head>
  <body>
    <h1>Registration Form</h1>
    <form>
        <label> First Name: </label>
        <input type="text" placeholder="Dezal" />
        <br />
        <label> Last Name: </label>
        <input type="text" placeholder="Jain" />
        <br />
        <label> Phone Number: </label>
        <input type="number" placeholder="894125845" />
        <br />
        <label> Email Address </label>
        <input type="email" placeholder="abc@gmail.com" />
        <br />
        <label> College: </label>
        <input type="radio" />
        <label>ACET</label>
        <input type="radio" />
        <label>AEC</label>
        <input type="radio" />
        <label>AUS</label>
        <br />
        <label> Gender: </label>
        <input type="radio" />
        <label> Male </label>
        <input type="radio" />
        <label> Female </label>
        <br>
        <input type="submit" />
        <input type="reset">
    </form>
  </body>
</html>
